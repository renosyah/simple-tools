<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tailwind Responsive Grid Editor</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#0b1120;color:#e5e7eb}
button,input,select{font:inherit}
button{padding:8px 13px;border:1px solid #475569;border-radius:7px;background:#1e293b;color:#e5e7eb;cursor:pointer;transition:.15s ease;box-shadow:0 1px 2px rgba(0,0,0,.2)}
button:hover{background:#334155;border-color:#64748b;transform:translateY(-1px)}
button:active{transform:translateY(0)}
button.active{background:#2563eb;border-color:#60a5fa;color:#fff;box-shadow:0 0 0 2px rgba(37,99,235,.2)}
button.danger{background:#7f1d1d;border-color:#991b1b;color:#fecaca}
button.danger:hover{background:#b91c1c;border-color:#ef4444;color:#fff}

.toolbar{
  min-height:64px;display:flex;align-items:center;gap:8px;padding:10px 16px;
  background:#111827;border-bottom:1px solid #334155;box-shadow:0 3px 14px rgba(0,0,0,.25);
  flex-wrap:wrap
}
.toolbar span{font-size:12px;color:#94a3b8}
.toolbar b{color:#e2e8f0}
.toolbar-spacer{display:none}

.editor{
  height:calc(100vh - 64px);display:grid;grid-template-columns:540px minmax(0,1fr);
  background:#0f172a
}

.canvas-wrapper{
  grid-column:2;padding:30px;overflow:auto;min-width:0;
  background:
    radial-gradient(circle at top left,rgba(37,99,235,.06),transparent 35%),
    #0f172a
}

.canvas{
  position:relative;width:900px;min-height:500px;display:grid;gap:5px;padding:4px;
  background-color:#080e1a;border:1px solid #475569;border-radius:10px;
  box-shadow:0 12px 35px rgba(0,0,0,.25);
  background-image:
    linear-gradient(to right,rgba(148,163,184,.09) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(148,163,184,.09) 1px,transparent 1px)
}

.block{
  position:relative;min-width:0;min-height:0;overflow:hidden;display:flex;
  align-items:center;justify-content:center;background:linear-gradient(145deg,#2563eb,#1d4ed8);
  border:2px solid #60a5fa;border-radius:7px;cursor:move;user-select:none;
  box-shadow:0 4px 10px rgba(0,0,0,.18);transition:box-shadow .12s,border-color .12s
}
.block:hover{box-shadow:0 6px 16px rgba(0,0,0,.3)}
.block.selected{border-color:#facc15;box-shadow:0 0 0 2px rgba(250,204,21,.25),0 7px 18px rgba(0,0,0,.3)}
.block-content{max-width:100%;padding:8px;text-align:center;pointer-events:none}
.block-name{font-weight:700;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.block-class{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.82;word-break:break-word}
.resize-handle{position:absolute;right:0;bottom:0;width:17px;height:17px;background:#facc15;border-top-left-radius:5px;cursor:se-resize;box-shadow:-2px -2px 6px rgba(0,0,0,.2)}
.delete-handle{
  position:absolute;right:5px;top:5px;width:22px;height:22px;padding:0;
  display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.15);
  border-radius:5px;background:rgba(15,23,42,.55);color:#fff;font-size:15px;line-height:1;cursor:pointer
}
.delete-handle:hover{background:#dc2626;border-color:#f87171;transform:none}

.sidebar{
  grid-column:1;grid-row:1;padding:22px;background:#111827;
  border-right:1px solid #334155;overflow-y:auto;min-width:0;text-align:left
}
.sidebar h3{margin:0 0 13px;text-align:left;font-size:14px;color:#f1f5f9}
.section{
  padding:0 0 20px;margin:0 0 20px;border-bottom:1px solid #263449
}
.section:last-child{border-bottom:0}
.field{
  display:grid;grid-template-columns:minmax(0,1fr) 120px;align-items:center;
  gap:10px;margin-bottom:10px;text-align:left
}
.field:last-child{margin-bottom:0}
.field label{font-size:12px;color:#cbd5e1}
input[type=text],input[type=number],select{
  width:100%;height:34px;padding:6px 9px;border:1px solid #475569;border-radius:6px;
  background:#0b1220;color:#f8fafc;outline:0;transition:.15s
}
input:hover,select:hover{border-color:#64748b}
input:focus,select:focus{border-color:#60a5fa;box-shadow:0 0 0 2px rgba(59,130,246,.14)}
input:disabled{opacity:.45;cursor:not-allowed}

.bp-grid{
  display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:10px;margin-bottom:11px
}
.bp-card{
  padding:12px;background:#0b1220;border:1px solid #334155;border-radius:8px;
  min-width:0;text-align:left;box-shadow:0 3px 10px rgba(0,0,0,.12)
}
.bp-card:hover{border-color:#475569}
.bp-card.disabled{opacity:.48}
.bp-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px
}
.bp-head strong{font-size:12px;letter-spacing:.04em;color:#e2e8f0}
.toggle{font-size:10px;padding:4px 7px}
.bp-card:not(.disabled) .toggle{background:#14532d;border-color:#166534;color:#bbf7d0}
.bp-card.disabled .toggle{background:#3f1d1d;border-color:#7f1d1d;color:#fecaca}

.code{
  background:#080e1a;border:1px solid #334155;padding:12px;border-radius:7px;
  font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;
  word-break:break-word;min-height:72px;color:#93c5fd
}
.block-list{display:flex;flex-direction:column;gap:6px}
.block-item{
  display:flex;align-items:center;gap:8px;padding:9px 10px;background:#0b1220;
  border:1px solid #263449;border-radius:7px;cursor:pointer;transition:.12s
}
.block-item:hover{background:#172033;border-color:#475569}
.block-item.selected{border-color:#facc15;background:#1c1917;box-shadow:0 0 0 1px rgba(250,204,21,.15)}
.block-item-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:#e2e8f0}
.block-item-id{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:#64748b}
.block-item-x{
  width:24px;height:24px;padding:0;background:transparent;color:#94a3b8;
  border-color:transparent;box-shadow:none
}
.block-item-x:hover{background:#991b1b;color:#fff;border-color:#b91c1c;transform:none}
.hint{
  margin-top:14px;color:#64748b;font-size:11px;line-height:1.6;
  padding:10px 12px;background:#111827;border:1px solid #263449;border-radius:7px
}
.status{font-size:11px;color:#64748b}
.row{display:flex;gap:7px;justify-content:flex-start;align-items:flex-start}

#selectedInfo{
  padding:13px;background:#0b1220;border:1px solid #334155;border-radius:8px
}
#selectedInfo .field{margin-bottom:9px}
#selectedInfo .danger{margin-top:5px}

#gridStatus{
  padding:7px 9px;border-radius:5px;background:#0b1220;border:1px solid #263449;
  display:inline-block
}

.empty{
  height:100%;min-height:400px;display:flex;align-items:center;justify-content:center;
  color:#64748b;text-align:center;border:1px dashed #475569;border-radius:7px;
  background:rgba(15,23,42,.35);line-height:1.6
}

@media(max-width:1000px){
  .editor{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .sidebar{grid-column:1;grid-row:1;max-height:48vh;border-right:0;border-bottom:1px solid #334155}
  .canvas-wrapper{grid-column:1;grid-row:2;min-height:52vh}
}
@media(max-width:650px){
  .bp-grid{grid-template-columns:1fr}
  .field{grid-template-columns:minmax(0,1fr) 110px}
  .toolbar{height:auto;padding:9px 10px}
  .editor{height:calc(100vh - 110px)}
  .canvas-wrapper{padding:16px}
}
</style>
</head>
<body>

<div class="toolbar">
  <button id="btn-sm" style="width:80px" onclick="switchBreakpoint('sm')">SM</button>
  <button id="btn-md" style="width:80px" onclick="switchBreakpoint('md')">MD</button>
  <button id="btn-lg" style="width:80px" onclick="switchBreakpoint('lg')">LG</button>
  <span>Editing: <b id="currentBreakpoint">lg</b></span>
  <span class="toolbar-spacer"></span>
  <button style="min-width:140px;height:40px" onclick="addBlock()">＋ Add Block</button>
  <button style="min-width:120px;height:40px" onclick="copyCode()">Copy Code</button>
  <button style="min-width:80px;height:40px" onclick="resetAll()">Reset</button>
</div>

<div class="editor">
  <div class="canvas-wrapper">
    <div id="canvas" class="canvas"></div>
    <div class="hint">
      Drag a block to move it. Drag the yellow corner to resize it.
      The X button deletes the logical block from <b>SM + MD + LG</b>.
      Parent grid settings are independent for each breakpoint.
    </div>
  </div>

  <aside class="sidebar">
    <div class="section">
      <h3>Parent Grid</h3>
      <div class="bp-grid">
        <div class="bp-card" id="card-sm">
          <div class="bp-head"><strong>SM</strong><button class="toggle" onclick="toggleBreakpoint('sm')">Enabled</button></div>
          <div class="field"><label>Columns</label><input style="width:80px;margin-left:40px" type="number" min="1" max="12" value="12" data-bp="sm" data-key="cols" oninput="changeGridSetting(this)"></div>
          <div class="field"><label>Rows</label><input style="width:80px;margin-left:40px" type="number" min="1" max="12" value="12" data-bp="sm" data-key="rows" oninput="changeGridSetting(this)"></div>
        </div>
        <div class="bp-card" id="card-md">
          <div class="bp-head"><strong>MD</strong><button class="toggle" onclick="toggleBreakpoint('md')">Enabled</button></div>
          <div class="field"><label>Columns</label><input style="width:80px;margin-left:40px" type="number" min="1" max="12" value="12" data-bp="md" data-key="cols" oninput="changeGridSetting(this)"></div>
          <div class="field"><label>Rows</label><input style="width:80px;margin-left:40px" type="number" min="1" max="12" value="12" data-bp="md" data-key="rows" oninput="changeGridSetting(this)"></div>
        </div>
        <div class="bp-card" id="card-lg">
          <div class="bp-head"><strong>LG</strong><button class="toggle" onclick="toggleBreakpoint('lg')">Enabled</button></div>
          <div class="field"><label>Columns</label><input style="width:80px;margin-left:40px" type="number" min="1" max="12" value="12" data-bp="lg" data-key="cols" oninput="changeGridSetting(this)"></div>
          <div class="field"><label>Rows</label><input style="width:80px;margin-left:40px" type="number" min="1" max="12" value="12" data-bp="lg" data-key="rows" oninput="changeGridSetting(this)"></div>
        </div>
      </div>
      <div class="status" id="gridStatus"></div>
    </div>

    <div class="section">
      <h3>Selected Block</h3>
      <div id="selectedInfo">Nothing selected</div>
    </div>

    <div class="section">
      <h3>Generated Tailwind</h3>
      <div id="generatedCode" class="code"></div>
    </div>

    <div>
      <h3>Blocks</h3>
      <div id="blockList" class="block-list"></div>
    </div>
  </aside>
</div>

<script>
const BREAKPOINTS=["sm","md","lg"];
const PREFIX={sm:"sm:",md:"md:",lg:"lg:"};

let currentBreakpoint="lg";
let selectedId=null;
let nextId=1;

const grid={
  sm:{enabled:true,cols:12,rows:12},
  md:{enabled:true,cols:12,rows:12},
  lg:{enabled:true,cols:12,rows:12}
};

const layouts={sm:[],md:[],lg:[]};

function getLayout(bp=currentBreakpoint){return layouts[bp]}

function cloneBlock(block){
  return {
    id:block.id,name:block.name,
    colStart:block.colStart,colSpan:block.colSpan,
    rowStart:block.rowStart,rowSpan:block.rowSpan
  };
}

function getBlock(id,bp=currentBreakpoint){
  return layouts[bp].find(b=>b.id===id);
}

function getLogicalBlock(id){
  return layouts.lg.find(b=>b.id===id) ||
         layouts.md.find(b=>b.id===id) ||
         layouts.sm.find(b=>b.id===id);
}

function escapeHtml(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function clamp(v,min,max){return Math.max(min,Math.min(max,v))}

function toggleBreakpoint(bp){
  grid[bp].enabled=!grid[bp].enabled;
  updateGridControls();
  render();
}

function changeGridSetting(input){
  const bp=input.dataset.bp;
  const key=input.dataset.key;
  let value=parseInt(input.value,10);
  if(!Number.isFinite(value)) value=1;
  grid[bp][key]=clamp(value,1,12);
  input.value=grid[bp][key];
  normalizeLayout(bp);
  render();
}

function normalizeLayout(bp){
  const g=grid[bp];
  layouts[bp].forEach(b=>{
    b.colSpan=clamp(b.colSpan,1,g.cols);
    b.rowSpan=clamp(b.rowSpan,1,g.rows);
    b.colStart=clamp(b.colStart,1,Math.max(1,g.cols-b.colSpan+1));
    b.rowStart=clamp(b.rowStart,1,Math.max(1,g.rows-b.rowSpan+1));
  });
}

function addBlock(){
  const name=prompt("Block name:");
  if(name===null)return;
  const clean=name.trim();
  if(!clean){alert("Please enter a block name.");return}

  const id=nextId++;
  const positions={};

  for(const bp of BREAKPOINTS){
    const pos=findEmptyPosition(bp,Math.min(2,grid[bp].cols),Math.min(2,grid[bp].rows));
    if(!pos){
      alert(`Cannot add "${clean}". No free space in ${bp.toUpperCase()} grid.`);
      return;
    }
    positions[bp]=pos;
  }

  for(const bp of BREAKPOINTS){
    const g=grid[bp];
    const colSpan=Math.min(2,g.cols);
    const rowSpan=Math.min(2,g.rows);
    layouts[bp].push({
      id,name:clean,
      colStart:positions[bp].col,colSpan,
      rowStart:positions[bp].row,rowSpan
    });
  }

  selectedId=id;
  render();
}

function deleteBlock(id){
  if(!confirm("Delete this block from SM, MD and LG?"))return;
  for(const bp of BREAKPOINTS){
    const i=layouts[bp].findIndex(b=>b.id===id);
    if(i>=0)layouts[bp].splice(i,1);
  }
  if(selectedId===id)selectedId=null;
  render();
}

function renameBlock(id){
  const block=getLogicalBlock(id);
  if(!block)return;
  const name=prompt("New block name:",block.name);
  if(name===null)return;
  const clean=name.trim();
  if(!clean)return;
  for(const bp of BREAKPOINTS){
    const b=getBlock(id,bp);
    if(b)b.name=clean;
  }
  render();
}

function findEmptyPosition(bp,colSpan,rowSpan){
  const g=grid[bp];
  const layout=layouts[bp];
  if(colSpan>g.cols||rowSpan>g.rows)return null;

  for(let row=1;row<=g.rows-rowSpan+1;row++){
    for(let col=1;col<=g.cols-colSpan+1;col++){
      if(!isOccupied(col,row,colSpan,rowSpan,null,bp))return {col,row};
    }
  }
  return null;
}

function isOccupied(col,row,colSpan,rowSpan,ignoreId=null,bp=currentBreakpoint){
  const right=col+colSpan-1,bottom=row+rowSpan-1;
  return layouts[bp].some(b=>{
    if(b.id===ignoreId)return false;
    const bRight=b.colStart+b.colSpan-1;
    const bBottom=b.rowStart+b.rowSpan-1;
    return col<=bRight && right>=b.colStart &&
           row<=bBottom && bottom>=b.rowStart;
  });
}

function switchBreakpoint(bp){
  currentBreakpoint=bp;
  document.getElementById("currentBreakpoint").textContent=bp;
  document.querySelectorAll(".toolbar button[id^='btn-']").forEach(b=>b.classList.remove("active"));
  document.getElementById("btn-"+bp).classList.add("active");
  if(selectedId!==null && !getBlock(selectedId,bp)){
    selectedId=layouts[bp][0]?.id??null;
  }
  render();
}

function render(){
  updateGridControls();

  const canvas=document.getElementById("canvas");
  const g=grid[currentBreakpoint];
  const layout=layouts[currentBreakpoint];

  if(!g.enabled){
    canvas.innerHTML='<div class="empty">This breakpoint is disabled.<br>Enable it from Parent Grid.</div>';
    canvas.style.display="block";
    updateSidebar();
    return;
  }

  canvas.style.display="grid";
  canvas.innerHTML="";
  canvas.style.gridTemplateColumns=`repeat(${g.cols},1fr)`;
  canvas.style.gridTemplateRows=`repeat(${g.rows},58px)`;
  canvas.style.minHeight=`${g.rows*58+4}px`;
  canvas.style.backgroundSize=`calc(100% / ${g.cols}) 58px`;

  if(!layout.length){
    canvas.innerHTML='<div class="empty" style="grid-column:1/-1;grid-row:1/-1">Empty grid<br>Click <b>＋ Add Block</b> to begin.</div>';
    updateSidebar();
    return;
  }

  layout.forEach(block=>{
    const el=document.createElement("div");
    el.className="block"+(block.id===selectedId?" selected":"");
    el.style.gridColumn=`${block.colStart} / span ${block.colSpan}`;
    el.style.gridRow=`${block.rowStart} / span ${block.rowSpan}`;

    el.innerHTML=`
      <div class="block-content">
        <div class="block-name">${escapeHtml(block.name)}</div>
        <div class="block-class">${escapeHtml(getTailwindClass(block))}</div>
      </div>
      <button class="delete-handle" title="Delete block">×</button>
      <div class="resize-handle"></div>
    `;

    el.addEventListener("mousedown",e=>{
      if(e.target.closest(".delete-handle")||e.target.closest(".resize-handle"))return;
      selectBlock(block.id);
      startDrag(e,block);
    });

    el.querySelector(".delete-handle").addEventListener("mousedown",e=>e.stopPropagation());
    el.querySelector(".delete-handle").addEventListener("click",e=>{
      e.stopPropagation();
      deleteBlock(block.id);
    });

    el.querySelector(".resize-handle").addEventListener("mousedown",e=>{
      e.stopPropagation();
      selectBlock(block.id);
      startResize(e,block);
    });

    canvas.appendChild(el);
  });

  updateSidebar();
}

function selectBlock(id){
  selectedId=id;
  render();
}

function startDrag(e,block){
  e.preventDefault();

  const rect=document.getElementById("canvas").getBoundingClientRect();
  const g=grid[currentBreakpoint];
  const cellW=(rect.width-4-(g.cols-1)*4)/g.cols;
  const cellH=58;
  const startX=e.clientX,startY=e.clientY;
  const originalCol=block.colStart,originalRow=block.rowStart;

  function move(ev){
    const dx=Math.round((ev.clientX-startX)/(cellW+4));
    const dy=Math.round((ev.clientY-startY)/(cellH+4));
    const newCol=clamp(originalCol+dx,1,g.cols-block.colSpan+1);
    const newRow=clamp(originalRow+dy,1,g.rows-block.rowSpan+1);

    if(!isOccupied(newCol,newRow,block.colSpan,block.rowSpan,block.id)){
      block.colStart=newCol;
      block.rowStart=newRow;
      render();
    }
  }

  function stop(){
    document.removeEventListener("mousemove",move);
    document.removeEventListener("mouseup",stop);
  }
  document.addEventListener("mousemove",move);
  document.addEventListener("mouseup",stop);
}

function startResize(e,block){
  e.preventDefault();

  const rect=document.getElementById("canvas").getBoundingClientRect();
  const g=grid[currentBreakpoint];
  const cellW=(rect.width-4-(g.cols-1)*4)/g.cols;
  const cellH=58;
  const startX=e.clientX,startY=e.clientY;
  const originalW=block.colSpan,originalH=block.rowSpan;

  function move(ev){
    const dw=Math.round((ev.clientX-startX)/(cellW+4));
    const dh=Math.round((ev.clientY-startY)/(cellH+4));

    const newW=clamp(originalW+dw,1,g.cols-block.colStart+1);
    const newH=clamp(originalH+dh,1,g.rows-block.rowStart+1);

    if(!isOccupied(block.colStart,block.rowStart,newW,newH,block.id)){
      block.colSpan=newW;
      block.rowSpan=newH;
      render();
    }
  }

  function stop(){
    document.removeEventListener("mousemove",move);
    document.removeEventListener("mouseup",stop);
  }
  document.addEventListener("mousemove",move);
  document.addEventListener("mouseup",stop);
}

function getTailwindClass(block){
  const g=grid[currentBreakpoint];
  const col=`col-span-${block.colSpan}`;
  const row=`row-span-${block.rowSpan}`;
  return `${col} ${row}`;
}

function generatedForBlock(id){
  const parts=[];
  for(const bp of BREAKPOINTS){
    const b=getBlock(id,bp);
    if(!b||!grid[bp].enabled)continue;

    parts.push(
      bp==="sm" ? `${PREFIX.sm}col-span-${b.colSpan} ${PREFIX.sm}row-span-${b.rowSpan}` :
      bp==="md" ? `${PREFIX.md}col-span-${b.colSpan} ${PREFIX.md}row-span-${b.rowSpan}` :
      `${PREFIX.lg}col-span-${b.colSpan} ${PREFIX.lg}row-span-${b.rowSpan}`
    );
  }
  return parts.join(" ");
}

function parentGridCode(){
  const parts=[];
  for(const bp of BREAKPOINTS){
    if(!grid[bp].enabled)continue;
    const prefix=bp==="sm"?PREFIX.sm:bp==="md"?PREFIX.md:PREFIX.lg;
    parts.push(`${prefix}grid-cols-${grid[bp].cols}`);
    parts.push(`${prefix}grid-rows-${grid[bp].rows}`);
  }
  return parts.join(" ");
}

function updateSidebar(){
  const info=document.getElementById("selectedInfo");
  const code=document.getElementById("generatedCode");
  const list=document.getElementById("blockList");

  if(selectedId===null){
    info.innerHTML="<span class='status'>Nothing selected</span>";
    code.textContent=parentGridCode()||"(all breakpoints disabled)";
  }else{
    const b=getBlock(selectedId);
    const logical=getLogicalBlock(selectedId);
    if(!b||!logical){
      selectedId=null;
      return updateSidebar();
    }

    info.innerHTML=`
      <div class="field"><label>Name</label>
        <input type="text" value="${escapeHtml(logical.name)}" onchange="renameFromInput(${selectedId},this.value)">
      </div>
      <div class="field"><label>Column start</label><input type="number" min="1" max="${grid[currentBreakpoint].cols}" value="${b.colStart}" onchange="editGeometry('colStart',this.value)"></div>
      <div class="field"><label>Column span</label><input type="number" min="1" max="${grid[currentBreakpoint].cols}" value="${b.colSpan}" onchange="editGeometry('colSpan',this.value)"></div>
      <div class="field"><label>Row start</label><input type="number" min="1" max="${grid[currentBreakpoint].rows}" value="${b.rowStart}" onchange="editGeometry('rowStart',this.value)"></div>
      <div class="field"><label>Row span</label><input type="number" min="1" max="${grid[currentBreakpoint].rows}" value="${b.rowSpan}" onchange="editGeometry('rowSpan',this.value)"></div>
      <button class="danger" onclick="deleteBlock(${selectedId})">Delete Block</button>
    `;

    code.textContent=generatedForBlock(selectedId);
  }

  list.innerHTML="";
  const ids=[...new Set(BREAKPOINTS.flatMap(bp=>layouts[bp].map(b=>b.id)))];

  if(!ids.length){
    list.innerHTML='<div class="status">No blocks yet.</div>';
  }else{
    ids.forEach(id=>{
      const b=getLogicalBlock(id);
      const item=document.createElement("div");
      item.className="block-item"+(id===selectedId?" selected":"");
      item.innerHTML=`
        <span class="block-item-name">${escapeHtml(b.name)}</span>
        <span class="block-item-id">#${id}</span>
        <button class="block-item-x" title="Delete block">×</button>
      `;
      item.addEventListener("click",e=>{
        if(e.target.closest(".block-item-x"))return;
        selectedId=id;
        render();
      });
      item.querySelector(".block-item-x").addEventListener("click",e=>{
        e.stopPropagation();
        deleteBlock(id);
      });
      list.appendChild(item);
    });
  }
}

function renameFromInput(id,value){
  const clean=value.trim();
  if(!clean)return;
  for(const bp of BREAKPOINTS){
    const b=getBlock(id,bp);
    if(b)b.name=clean;
  }
  render();
}

function editGeometry(key,value){
  const b=getBlock(selectedId);
  if(!b)return;
  const g=grid[currentBreakpoint];
  let v=parseInt(value,10);
  if(!Number.isFinite(v))return;

  if(key==="colStart")v=clamp(v,1,g.cols-b.colSpan+1);
  if(key==="colSpan")v=clamp(v,1,g.cols-b.colStart+1);
  if(key==="rowStart")v=clamp(v,1,g.rows-b.rowSpan+1);
  if(key==="rowSpan")v=clamp(v,1,g.rows-b.rowStart+1);

  const candidate={...b,[key]:v};
  if(isOccupied(candidate.colStart,candidate.rowStart,candidate.colSpan,candidate.rowSpan,b.id)){
    alert("That size/position overlaps another block.");
    return;
  }
  Object.assign(b,candidate);
  render();
}

function updateGridControls(){
  for(const bp of BREAKPOINTS){
    const g=grid[bp];
    const card=document.getElementById("card-"+bp);
    card.classList.toggle("disabled",!g.enabled);
    card.querySelector(".toggle").textContent=g.enabled?"Enabled":"Disabled";
    card.querySelectorAll("input").forEach(input=>{
      input.disabled=!g.enabled;
      input.value=g[input.dataset.key];
    });
  }

  const g=grid[currentBreakpoint];
  document.getElementById("gridStatus").textContent=
    `${currentBreakpoint.toUpperCase()}: ${g.enabled?`${g.cols} columns × ${g.rows} rows`:"disabled"}`;
}

async function copyCode(){
  let out=`<div class="grid ${parentGridCode()}">\n`;
  const ids=[...new Set(BREAKPOINTS.flatMap(bp=>layouts[bp].map(b=>b.id)))];

  ids.forEach(id=>{
    const b=getLogicalBlock(id);
    out+=`  <div class="${generatedForBlock(id)}">${escapeHtml(b.name)}</div>\n`;
  });
  out+="</div>";

  try{
    await navigator.clipboard.writeText(out);
    alert("Tailwind code copied.");
  }catch{
    prompt("Copy this code:",out);
  }
}

function resetAll(){
  if(!confirm("Reset the editor? This removes all blocks and restores 12×12 grids."))return;
  for(const bp of BREAKPOINTS){
    grid[bp]={enabled:true,cols:12,rows:12};
    layouts[bp]=[];
  }
  selectedId=null;
  nextId=1;
  render();
}

switchBreakpoint("lg");
</script>
</body>
</html>
