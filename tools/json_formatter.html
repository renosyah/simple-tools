<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JSON Formatter</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                sans-serif;

            background: #111827;

            color: white;
        }


        /* =====================================================
           TOOLBAR
        ===================================================== */

        .toolbar {
            min-height: 60px;

            display: flex;

            align-items: center;

            gap: 10px;

            padding: 10px 15px;

            background: #1f2937;

            border-bottom:
                1px solid #374151;
        }


        .toolbar-title {
            font-size: 18px;

            font-weight: bold;
        }


        .toolbar-spacer {
            flex: 1;
        }


        button {
            padding:
                8px 14px;

            border: 0;

            border-radius: 5px;

            cursor: pointer;

            background: #374151;

            color: white;
        }


        button:hover {
            background: #4b5563;
        }


        .primary {
            background: #2563eb;
        }


        .primary:hover {
            background: #1d4ed8;
        }


        .danger {
            background: #7f1d1d;
        }


        .danger:hover {
            background: #991b1b;
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .main {
            height:
                calc(100vh - 60px);

            display: flex;

            flex-direction: column;

            padding: 20px;

            gap: 15px;
        }


        /* =====================================================
           INPUT / OUTPUT
        ===================================================== */

        .io-grid {
            flex: 1;

            min-height: 0;

            display: grid;

            grid-template-columns:
                1fr
                1fr;

            gap: 15px;
        }


        .panel {
            min-width: 0;

            min-height: 0;

            display: flex;

            flex-direction: column;

            background: #1f2937;

            border:
                1px solid #374151;

            border-radius: 8px;

            overflow: hidden;
        }


        .panel-header {
            min-height: 42px;

            display: flex;

            align-items: center;

            padding:
                0 12px;

            border-bottom:
                1px solid #374151;

            color: #d1d5db;

            font-size: 13px;

            font-weight: bold;
        }


        .panel-header-spacer {
            flex: 1;
        }


        textarea {
            flex: 1;

            width: 100%;

            resize: none;

            border: 0;

            outline: 0;

            padding: 15px;

            background: #111827;

            color: #d1d5db;

            font-family:
                Consolas,
                "Courier New",
                monospace;

            font-size: 13px;

            line-height: 1.6;
        }


        textarea::placeholder {
            color: #6b7280;
        }


        .output {
            flex: 1;

            overflow: auto;

            padding: 15px;

            background: #111827;

            font-family:
                Consolas,
                "Courier New",
                monospace;

            font-size: 13px;

            line-height: 1.6;

            white-space: pre-wrap;

            word-break: break-word;
        }


        /* =====================================================
           STATUS
        ===================================================== */

        .status {
            padding:
                8px 12px;

            font-size: 12px;

            border-top:
                1px solid #374151;
        }


        .status.valid {
            color: #34d399;

            background: #064e3b;
        }


        .status.invalid {
            color: #fca5a5;

            background: #450a0a;
        }


        .status.empty {
            color: #9ca3af;

            background: #111827;
        }


        /* =====================================================
           LOWER SECTION
        ===================================================== */

        .lower {
            height: 330px;

            min-height: 250px;

            display: flex;

            flex-direction: column;

            background: #1f2937;

            border:
                1px solid #374151;

            border-radius: 8px;

            overflow: hidden;
        }


        .tabs {
            display: flex;

            border-bottom:
                1px solid #374151;

            background: #1f2937;
        }


        .tab {
            padding:
                10px 16px;

            background: transparent;

            border-radius: 0;

            color: #9ca3af;
        }


        .tab:hover {
            background: #273449;
        }


        .tab.active {
            color: white;

            background: #374151;
        }


        .tab-content {
            flex: 1;

            min-height: 0;

            overflow: auto;

            padding: 15px;
        }


        /* =====================================================
           TABLE
        ===================================================== */

        .table-wrapper {
            width: 100%;

            overflow: auto;
        }


        table {
            width: 100%;

            border-collapse: collapse;

            font-size: 13px;
        }


        th,
        td {
            padding:
                8px 10px;

            text-align: left;

            border-bottom:
                1px solid #374151;

            white-space: nowrap;
        }


        th {
            position: sticky;

            top: 0;

            background: #374151;

            color: #e5e7eb;
        }


        td {
            color: #d1d5db;
        }


        tr:hover td {
            background: #273449;
        }


        .null-value {
            color: #6b7280;
        }


        /* =====================================================
           CHART
        ===================================================== */

        .chart-controls {
            display: flex;

            gap: 10px;

            margin-bottom: 15px;

            flex-wrap: wrap;
        }


        .chart-control {
            display: flex;

            align-items: center;

            gap: 6px;

            font-size: 12px;

            color: #9ca3af;
        }


        .chart-control select {
            padding:
                6px 8px;

            border:
                1px solid #4b5563;

            border-radius: 5px;

            background: #111827;

            color: white;
        }


        .chart {
            width: 100%;

            height: 220px;

            display: flex;

            align-items: flex-end;

            gap: 8px;

            padding:
                20px 10px 25px;

            border:
                1px solid #374151;

            border-radius: 6px;

            background: #111827;

            overflow-x: auto;
        }


        .bar-container {
            min-width: 45px;

            height: 100%;

            display: flex;

            flex-direction: column;

            justify-content: flex-end;

            align-items: center;

            gap: 4px;
        }


        .bar-value {
            font-size: 10px;

            color: #9ca3af;
        }


        .bar {
            width: 28px;

            min-height: 2px;

            background: #3b82f6;

            border-radius:
                3px 3px 0 0;

            transition:
                height .2s;
        }


        .bar-label {
            max-width: 60px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            font-size: 10px;

            color: #9ca3af;
        }


        .empty-message {
            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #6b7280;

            font-size: 13px;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 800px) {

            .io-grid {
                grid-template-columns:
                    1fr;
            }


            .main {
                height: auto;

                min-height:
                    calc(100vh - 60px);
            }


            .panel {
                min-height: 300px;
            }


            .lower {
                min-height: 350px;
            }

        }

    </style>

</head>


<body>

<div id="app">

<!-- =========================================================
     TOOLBAR
========================================================= -->

<div class="toolbar">

    <div class="toolbar-title">
        🧾 JSON Formatter
    </div>


    <div class="toolbar-spacer"></div>


    <button
        @click="loadExample"
    >
        Example
    </button>


    <button
        class="primary"
        @click="formatJSON"
    >
        Format
    </button>


    <button
        @click="copyOutput"
    >
        Copy
    </button>


    <button
        class="danger"
        @click="clearAll"
    >
        Clear
    </button>

</div>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="main">


    <!-- =====================================================
         INPUT / OUTPUT
    ====================================================== -->

    <div class="io-grid">


        <!-- INPUT -->

        <div class="panel">

            <div class="panel-header">

                JSON Input

                <div
                    class="panel-header-spacer"
                ></div>

                <span>
                    Paste JSON
                </span>

            </div>


            <textarea
                v-model="jsonInput"
                spellcheck="false"
                placeholder='Paste JSON here...

Example:

[
    {
        "name": "Reno",
        "age": 30
    }
]'
                @input="validateJSON"
            ></textarea>


            <div
                :class="statusClass"
            >
                {{ statusText }}

            </div>

        </div>


        <!-- OUTPUT -->

        <div class="panel">

            <div class="panel-header">

                Formatted JSON

            </div>


            <div
                class="output"
            >
                {{ jsonOutput }}

            </div>

        </div>

    </div>


    <!-- =====================================================
         LOWER
    ====================================================== -->

    <div class="lower">


        <!-- TABS -->

        <div class="tabs">

            <button
                class="tab"
                :class="{ active: activeTab === 'table' }"
                @click="showTab('table')"
            >
                📋 Table
            </button>


            <button
                class="tab"
                :class="{ active: activeTab === 'chart' }"
                @click="showTab('chart')"
            >
                📊 Visualization
            </button>

        </div>


        <!-- TABLE -->

        <div
            v-show="activeTab === 'table'"
            class="tab-content"
        >

            <div
                v-html="tableHtml"
            ></div>

        </div>


        <!-- CHART -->

        <div
            v-show="activeTab === 'chart'"
            class="tab-content"
        >

            <div class="chart-controls">


                <div class="chart-control">

                    Chart:

                    <select
                        v-model="chartType"
                        @change="renderChart"
                    >

                        <option value="auto">
                            Auto
                        </option>

                        <option value="bar">
                            Bar
                        </option>

                    </select>

                </div>


                <div
                    class="chart-control"
                >

                    X:

                    <select
                        v-model="xColumn"
                        @change="renderChart"
                    >

                        <option
                            v-for="column in columns"
                            :key="column"
                            :value="column"
                        >
                            {{ column }}
                        </option>

                    </select>

                </div>


                <div
                    class="chart-control"
                >

                    Y:

                    <select
                        v-model="yColumn"
                        @change="renderChart"
                    >

                        <option
                            v-for="column in columns"
                            :key="column"
                            :value="column"
                        >
                            {{ column }}
                        </option>

                    </select>

                </div>

            </div>


            <div
                v-html="chartHtml"
            ></div>

        </div>

    </div>

</main>

</div>


<script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>

<script>

new Vue({

    el: "#app",


    data: {

        jsonInput: "",

        jsonOutput:
            "Formatted JSON will appear here.",

        statusClass:
            "status empty",

        statusText:
            "Waiting for JSON...",

        currentData: null,

        tableData: [],

        columns: [],

        activeTab: "table",

        chartType: "auto",

        xColumn: "",

        yColumn: "",

        tableHtml: `
            <div class="empty-message">
                Array/object data will appear here.
            </div>
        `,

        chartHtml: `
            <div class="empty-message">
                Numeric JSON data will be visualized here.
            </div>
        `

    },


    mounted() {

        this.validateJSON();

    },


    methods: {

        validateJSON() {

            const text =
                this.jsonInput.trim();


            if (!text) {

                this.statusClass =
                    "status empty";

                this.statusText =
                    "Waiting for JSON...";

                this.currentData = null;

                return;

            }


            try {

                this.currentData =
                    JSON.parse(
                        text
                    );


                this.statusClass =
                    "status valid";

                this.statusText =
                    "✓ Valid JSON";


            } catch (error) {

                this.statusClass =
                    "status invalid";

                this.statusText =
                    "✕ " +
                    error.message;

                this.currentData = null;

            }

        },


        formatJSON() {

            const text =
                this.jsonInput.trim();


            if (!text) {

                this.jsonOutput =
                    "Nothing to format.";

                return;

            }


            try {

                const data =
                    JSON.parse(
                        text
                    );


                this.currentData =
                    data;


                this.jsonOutput =
                    JSON.stringify(
                        data,
                        null,
                        4
                    );


                this.statusClass =
                    "status valid";

                this.statusText =
                    "✓ Valid JSON";


                this.generateTable(
                    data
                );


                this.prepareChart(
                    data
                );


            } catch (error) {

                this.jsonOutput =
                    "Invalid JSON\n\n" +
                    error.message;


                this.statusClass =
                    "status invalid";

                this.statusText =
                    "✕ Invalid JSON";


                this.clearResults();

            }

        },


        generateTable(data) {

            let rows = [];


            if (
                Array.isArray(data) &&
                data.length > 0 &&
                data.every(
                    item =>
                        item !== null &&
                        typeof item === "object" &&
                        !Array.isArray(item)
                )
            ) {

                rows =
                    data;

            }


            else if (
                data !== null &&
                typeof data === "object" &&
                !Array.isArray(data)
            ) {

                rows = [
                    data
                ];

            }


            else {

                this.tableHtml = `
                    <div class="empty-message">
                        Table view requires object or array-of-object data.
                    </div>
                `;

                return;

            }


            const flattened =
                rows.map(
                    row =>
                        this.flattenObject(
                            row
                        )
                );


            this.columns = [
                ...new Set(
                    flattened.flatMap(
                        row =>
                            Object.keys(row)
                    )
                )
            ];


            this.tableData =
                flattened;


            if (!this.columns.length) {

                this.tableHtml = `
                    <div class="empty-message">
                        No columns found.
                    </div>
                `;

                return;

            }


            let html = `
                <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
            `;


            this.columns.forEach(
                column => {

                    html += `
                        <th>
                            ${this.escapeHTML(column)}
                        </th>
                    `;

                }
            );


            html += `
                        </tr>
                    </thead>
                    <tbody>
            `;


            flattened.forEach(
                row => {

                    html += `
                        <tr>
                    `;


                    this.columns.forEach(
                        column => {

                            const value =
                                row[column];


                            html += `
                                <td>
                                    ${
                                        this.formatCell(
                                            value
                                        )
                                    }
                                </td>
                            `;

                        }
                    );


                    html += `
                        </tr>
                    `;

                }
            );


            html += `
                    </tbody>
                </table>
                </div>
            `;


            this.tableHtml =
                html;

        },


        flattenObject(
            object,
            prefix = "",
            result = {}
        ) {

            Object.entries(
                object
            ).forEach(
                ([key, value]) => {

                    const path =
                        prefix
                            ? `${prefix}.${key}`
                            : key;


                    if (
                        value !== null &&
                        typeof value === "object" &&
                        !Array.isArray(value)
                    ) {

                        this.flattenObject(
                            value,
                            path,
                            result
                        );

                    } else {

                        result[path] =
                            value;

                    }

                }
            );


            return result;

        },


        formatCell(
            value
        ) {

            if (
                value === null ||
                value === undefined
            ) {

                return `
                    <span class="null-value">
                        null
                    </span>
                `;

            }


            if (
                typeof value === "object"
            ) {

                return this.escapeHTML(
                    JSON.stringify(
                        value
                    )
                );

            }


            return this.escapeHTML(
                String(value)
            );

        },


        prepareChart(data) {

            let rows = [];


            if (
                Array.isArray(data) &&
                data.every(
                    item =>
                        item !== null &&
                        typeof item === "object" &&
                        !Array.isArray(item)
                )
            ) {

                rows =
                    data.map(
                        row =>
                            this.flattenObject(
                                row
                            )
                    );

            }


            if (!rows.length) {

                this.clearChart();

                return;

            }


            this.columns = [
                ...new Set(
                    rows.flatMap(
                        row =>
                            Object.keys(row)
                    )
                )
            ];


            this.tableData =
                rows;


            const numericColumns =
                this.columns.filter(
                    column =>
                        rows.some(
                            row =>
                                typeof row[column] ===
                                "number"
                        )
                );


            const textColumns =
                this.columns.filter(
                    column =>
                        rows.some(
                            row =>
                                typeof row[column] !==
                                "number"
                        )
                );


            if (
                textColumns.length
            ) {

                this.xColumn =
                    textColumns[0];

            }


            if (
                numericColumns.length
            ) {

                this.yColumn =
                    numericColumns[0];

            }


            this.renderChart();

        },


        renderChart() {

            if (!this.tableData.length) {

                this.clearChart();

                return;

            }


            const values =
                this.tableData
                    .map(
                        row => ({
                            label:
                                row[this.xColumn],
                            value:
                                Number(
                                    row[this.yColumn]
                                )
                        })
                    )
                    .filter(
                        item =>
                            Number.isFinite(
                                item.value
                            )
                    );


            if (!values.length) {

                this.chartHtml = `
                    <div class="empty-message">
                        No numeric values available for visualization.
                    </div>
                `;

                return;

            }


            const max =
                Math.max(
                    ...values.map(
                        item =>
                            item.value
                    )
                );


            const min =
                Math.min(
                    ...values.map(
                        item =>
                            item.value
                    )
                );


            let html =
                `<div class="chart">`;


            values.forEach(
                item => {

                    const height =
                        Math.max(
                            2,
                            (
                                (
                                    item.value -
                                    Math.min(
                                        0,
                                        min
                                    )
                                ) /
                                (
                                    max -
                                    Math.min(
                                        0,
                                        min
                                    ) || 1
                                )
                            ) *
                            100
                        );


                    html += `

                        <div
                            class="bar-container"
                        >

                            <div
                                class="bar-value"
                            >
                                ${this.escapeHTML(
                                    String(
                                        item.value
                                    )
                                )}
                            </div>

                            <div
                                class="bar"
                                style="
                                    height:${height}%
                                "
                                title="${this.escapeAttribute(
                                    String(
                                        item.value
                                    )
                                )}"
                            ></div>

                            <div
                                class="bar-label"
                                title="${this.escapeAttribute(
                                    String(
                                        item.label
                                    )
                                )}"
                            >
                                ${this.escapeHTML(
                                    String(
                                        item.label
                                    )
                                )}
                            </div>

                        </div>

                    `;

                }
            );


            html += `
                </div>
            `;


            this.chartHtml =
                html;

        },


        showTab(
            tab
        ) {

            this.activeTab =
                tab;


            if (
                tab === "chart"
            ) {

                this.renderChart();

            }

        },


        async copyOutput() {

            if (
                !this.currentData
            ) {

                return;

            }


            const text =
                JSON.stringify(
                    this.currentData,
                    null,
                    4
                );


            try {

                await navigator
                    .clipboard
                    .writeText(
                        text
                    );


            } catch (error) {

                console.error(
                    error
                );

            }

        },


        clearAll() {

            this.jsonInput = "";

            this.jsonOutput =
                "Formatted JSON will appear here.";


            this.statusClass =
                "status empty";

            this.statusText =
                "Waiting for JSON...";


            this.clearResults();

        },


        clearResults() {

            this.currentData = null;

            this.tableData = [];

            this.columns = [];


            this.tableHtml = `
                <div class="empty-message">
                    Array/object data will appear here.
                </div>
            `;


            this.clearChart();

        },


        clearChart() {

            this.chartHtml = `
                <div class="empty-message">
                    Numeric JSON data will be visualized here.
                </div>
            `;

        },


        loadExample() {

            this.jsonInput =
`[
    {
        "name": "Reno",
        "age": 30,
        "score": 85,
        "department": "Engineering"
    },
    {
        "name": "Alice",
        "age": 28,
        "score": 92,
        "department": "Design"
    },
    {
        "name": "Bob",
        "age": 34,
        "score": 76,
        "department": "Engineering"
    },
    {
        "name": "Charlie",
        "age": 26,
        "score": 88,
        "department": "Marketing"
    }
]`;


            this.formatJSON();

        },


        escapeHTML(
            value
        ) {

            return String(
                value
            )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        },


        escapeAttribute(
            value
        ) {

            return this.escapeHTML(
                value
            );

        }

    }

});

</script>

</body>

</html>
