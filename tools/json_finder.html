<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Explorer</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #111827;
    color: #e5e7eb;
}

/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {
    height: 56px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: #1f2937;
    border-bottom: 1px solid #374151;
}

.toolbar-title {
    font-size: 17px;
    font-weight: bold;
    white-space: nowrap;
}

.toolbar-spacer {
    flex: 1;
}

button {
    border: 0;
    border-radius: 5px;
    padding: 7px 12px;
    background: #374151;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #4b5563;
}

button.primary {
    background: #2563eb;
}

button.primary:hover {
    background: #1d4ed8;
}

button.danger {
    background: #7f1d1d;
}

button.danger:hover {
    background: #991b1b;
}

/* =========================================================
   WORKSPACE
========================================================= */

.workspace {
    position: relative;

    width: 100%;
    height: calc(100vh - 56px);

    overflow: hidden;

    background:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size: 20px 20px;
}

/* =========================================================
   WINDOW
========================================================= */

.window {
    position: absolute;

    min-width: 220px;
    min-height: 120px;

    display: flex;
    flex-direction: column;

    background: #1f2937;

    border: 1px solid #4b5563;
    border-radius: 7px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.35);

    overflow: hidden;

    resize: both;
}

.window.closed {
    display: none;
}

.window.maximized {
    left: 8px !important;
    top: 8px !important;
    width: calc(100% - 16px) !important;
    height: calc(100% - 16px) !important;
}

/* =========================================================
   WINDOW HEADER
========================================================= */

.window-header {
    height: 38px;
    min-height: 38px;

    display: flex;
    align-items: center;

    padding: 0 7px;

    gap: 7px;

    background: #273449;

    border-bottom: 1px solid #374151;

    cursor: grab;

    user-select: none;

    touch-action: none;
}

.window-header:active {
    cursor: grabbing;
}

.window-title {
    font-size: 12px;
    font-weight: bold;

    color: #d1d5db;
}

.window-spacer {
    flex: 1;
}

.window-button {
    width: 25px;
    height: 25px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0;

    background: transparent;

    color: #9ca3af;
}

.window-button:hover {
    background: #374151;
    color: white;
}

.window-button.close:hover {
    background: #991b1b;
}

/* =========================================================
   WINDOW BODY
========================================================= */

.window-body {
    flex: 1;
    min-height: 0;
    overflow: hidden;
}

/* =========================================================
   INPUT
========================================================= */

#window-input {
    left: 20px;
    top: 20px;

    width: 420px;
    height: 280px;
}

.input-body {
    display: flex;
    flex-direction: column;
    height: 100%;
}

textarea {
    width: 100%;
    height: 100%;

    flex: 1;

    resize: none;

    border: 0;
    outline: 0;

    padding: 12px;

    background: #111827;
    color: #d1d5db;

    font-family: Consolas, monospace;
    font-size: 12px;

    line-height: 1.5;
}

textarea::placeholder {
    color: #6b7280;
}

.status {
    min-height: 28px;

    padding: 6px 10px;

    font-size: 11px;

    color: #9ca3af;

    background: #111827;

    border-top: 1px solid #374151;
}

.status.valid {
    color: #34d399;
    background: #064e3b;
}

.status.invalid {
    color: #fca5a5;
    background: #450a0a;
}

/* =========================================================
   SEARCH
========================================================= */

#window-search {
    left: 460px;
    top: 20px;

    width: 400px;
    height: 120px;
}

.search-body {
    display: flex;
    align-items: center;
    gap: 8px;

    padding: 10px;
}

.search-input {
    flex: 1;

    height: 32px;

    border: 1px solid #4b5563;
    border-radius: 5px;

    outline: none;

    padding: 5px 9px;

    background: #111827;
    color: white;
}

.search-input:focus {
    border-color: #60a5fa;
}

.search-count {
    color: #9ca3af;

    font-size: 11px;

    white-space: nowrap;
}

/* =========================================================
   TREE
========================================================= */

#window-tree {
    left: 20px;
    top: 320px;

    width: 420px;
    height: 420px;
}

.tree {
    height: 100%;

    overflow: auto;

    padding: 8px;

    background: #111827;

    font-family: Consolas, monospace;
    font-size: 12px;
}

.tree-empty {
    padding: 30px 10px;

    text-align: center;

    color: #6b7280;
}

.tree-row {
    min-height: 27px;

    display: flex;
    align-items: center;

    gap: 5px;

    padding: 3px 5px;

    border-radius: 4px;

    cursor: pointer;
}

.tree-row:hover {
    background: #273449;
}

.tree-row.selected {
    background: #1d4ed8;
}

.tree-row.search-match {
    outline: 1px solid #f59e0b;
}

.tree-toggle {
    width: 15px;
    flex-shrink: 0;

    text-align: center;

    color: #9ca3af;
}

.tree-key {
    color: #93c5fd;
}

.tree-index {
    color: #c4b5fd;
}

.tree-value {
    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}

.tree-type {
    color: #6b7280;
    font-size: 10px;
}

.tree-children {
    margin-left: 17px;
}

.tree-children.hidden {
    display: none;
}

.type-string {
    color: #34d399;
}

.type-number {
    color: #fbbf24;
}

.type-boolean {
    color: #f472b6;
}

.type-null {
    color: #6b7280;
}

/* =========================================================
   INSPECTOR
========================================================= */

#window-inspector {
    left: 470px;
    top: 160px;

    width: 450px;
    height: 420px;
}

.inspector {
    height: 100%;

    overflow: auto;

    padding: 14px;

    background: #111827;
}

.inspector-empty {
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    color: #6b7280;
}

.field-title {
    margin-bottom: 12px;

    font-size: 18px;
    font-weight: bold;
}

.field-path {
    margin-bottom: 15px;

    padding: 9px;

    border: 1px solid #374151;
    border-radius: 5px;

    background: #1f2937;

    color: #93c5fd;

    font-family: Consolas, monospace;
    font-size: 11px;

    word-break: break-all;
}

.info-grid {
    display: grid;

    grid-template-columns: 100px minmax(0,1fr);

    gap: 1px;

    background: #374151;

    border: 1px solid #374151;
    border-radius: 5px;

    overflow: hidden;
}

.info-label {
    padding: 9px;

    background: #1f2937;

    color: #9ca3af;

    font-size: 11px;
}

.info-value {
    min-width: 0;

    padding: 9px;

    background: #111827;

    color: #d1d5db;

    font-family: Consolas, monospace;
    font-size: 11px;

    word-break: break-word;
}

.value-box {
    margin-top: 14px;
}

.value-box-title {
    margin-bottom: 6px;

    color: #9ca3af;

    font-size: 11px;
}

.raw-value {
    max-height: 300px;

    overflow: auto;

    padding: 10px;

    background: #1f2937;

    border: 1px solid #374151;
    border-radius: 5px;

    color: #d1d5db;

    font-family: Consolas, monospace;
    font-size: 11px;

    white-space: pre-wrap;

    word-break: break-word;
}

.inspector-buttons {
    display: flex;
    gap: 7px;

    margin-top: 8px;
}

/* =========================================================
   TABLE
========================================================= */

#window-table {
    left: 950px;
    top: 160px;

    width: 520px;
    height: 350px;
}

.table-wrapper {
    height: 100%;

    overflow: auto;

    background: #111827;
}

table {
    width: 100%;

    border-collapse: collapse;

    font-size: 11px;
}

th,
td {
    padding: 7px 9px;

    text-align: left;

    border-bottom: 1px solid #374151;

    white-space: nowrap;
}

th {
    position: sticky;
    top: 0;

    background: #374151;

    color: #e5e7eb;
}

td {
    color: #d1d5db;
}

tbody tr {
    cursor: pointer;
}

tbody tr:hover td {
    background: #273449;
}

.empty-message {
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 20px;

    color: #6b7280;

    text-align: center;

    font-size: 11px;
}

/* =========================================================
   WINDOW MANAGER
========================================================= */

.window-manager {
    position: fixed;

    right: 12px;
    bottom: 12px;

    z-index: 999999;

    display: flex;
    align-items: center;
    gap: 4px;

    padding: 5px;

    background: #1f2937;

    border: 1px solid #4b5563;
    border-radius: 6px;

    box-shadow: 0 8px 30px rgba(0,0,0,.4);
}

.manager-label {
    padding: 0 5px;

    color: #9ca3af;

    font-size: 10px;
}

.manager-button {
    padding: 5px 8px;

    font-size: 10px;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 800px) {

    body {
        overflow: hidden;
    }

    .window {
        min-width: 180px;
    }

    #window-input {
        left: 10px;
        top: 10px;
        width: calc(100% - 20px);
        height: 250px;
    }

    #window-search {
        left: 10px;
        top: 270px;
        width: calc(100% - 20px);
    }

    #window-tree {
        left: 10px;
        top: 400px;
        width: calc(100% - 20px);
    }

    #window-inspector {
        left: 10px;
        top: 500px;
        width: calc(100% - 20px);
    }

    #window-table {
        left: 10px;
        top: 600px;
        width: calc(100% - 20px);
    }
}
</style>
</head>

<body>

<!-- =========================================================
     TOOLBAR
========================================================= -->

<div class="toolbar">

    <div class="toolbar-title">
        🧾 JSON Explorer
    </div>

    <div class="toolbar-spacer"></div>

    <button onclick="loadExample()">
        Example
    </button>

    <button
        class="primary"
        onclick="parseJSON()"
    >
        Explore
    </button>

    <button onclick="copyFormatted()">
        Copy JSON
    </button>

    <button
        class="danger"
        onclick="clearAll()"
    >
        Clear
    </button>

</div>


<!-- =========================================================
     WORKSPACE
========================================================= -->

<div
    id="workspace"
    class="workspace"
>


    <!-- =====================================================
         INPUT
    ====================================================== -->

    <section
        id="window-input"
        class="window"
        data-window="input"
    >

        <div class="window-header">

            <span>📄</span>

            <span class="window-title">
                JSON Input
            </span>

            <div class="window-spacer"></div>

            <button
                class="window-button"
                onclick="maximizeWindow('window-input')"
            >
                □
            </button>

            <button
                class="window-button close"
                onclick="closeWindow('window-input')"
            >
                ×
            </button>

        </div>

        <div class="window-body input-body">

            <textarea
                id="jsonInput"
                spellcheck="false"
                placeholder="Paste JSON here..."
            ></textarea>

            <div
                id="status"
                class="status"
            >
                Waiting for JSON...
            </div>

        </div>

    </section>


    <!-- =====================================================
         SEARCH
    ====================================================== -->

    <section
        id="window-search"
        class="window"
        data-window="search"
    >

        <div class="window-header">

            <span>🔎</span>

            <span class="window-title">
                Search
            </span>

            <div class="window-spacer"></div>

            <button
                class="window-button"
                onclick="maximizeWindow('window-search')"
            >
                □
            </button>

            <button
                class="window-button close"
                onclick="closeWindow('window-search')"
            >
                ×
            </button>

        </div>

        <div class="window-body search-body">

            <input
                id="searchInput"
                class="search-input"
                placeholder="Search field, value or path..."
                oninput="searchTree()"
            >

            <span
                id="searchCount"
                class="search-count"
            >
                0 matches
            </span>

        </div>

    </section>


    <!-- =====================================================
         TREE
    ====================================================== -->

    <section
        id="window-tree"
        class="window"
        data-window="tree"
    >

        <div class="window-header">

            <span>🌳</span>

            <span class="window-title">
                Structure
            </span>

            <div class="window-spacer"></div>

            <button
                class="window-button"
                onclick="maximizeWindow('window-tree')"
            >
                □
            </button>

            <button
                class="window-button close"
                onclick="closeWindow('window-tree')"
            >
                ×
            </button>

        </div>

        <div
            id="tree"
            class="window-body tree"
        >

            <div class="tree-empty">
                Paste JSON and click
                <b>Explore</b>
            </div>

        </div>

    </section>


    <!-- =====================================================
         INSPECTOR
    ====================================================== -->

    <section
        id="window-inspector"
        class="window"
        data-window="inspector"
    >

        <div class="window-header">

            <span>🔬</span>

            <span class="window-title">
                Field Inspector
            </span>

            <div class="window-spacer"></div>

            <button
                class="window-button"
                onclick="maximizeWindow('window-inspector')"
            >
                □
            </button>

            <button
                class="window-button close"
                onclick="closeWindow('window-inspector')"
            >
                ×
            </button>

        </div>

        <div
            id="inspector"
            class="window-body inspector"
        >

            <div class="inspector-empty">
                Select a field from the JSON tree.
            </div>

        </div>

    </section>


    <!-- =====================================================
         TABLE
    ====================================================== -->

    <section
        id="window-table"
        class="window"
        data-window="table"
    >

        <div class="window-header">

            <span>📋</span>

            <span class="window-title">
                Array / Object Table
            </span>

            <div class="window-spacer"></div>

            <button
                class="window-button"
                onclick="maximizeWindow('window-table')"
            >
                □
            </button>

            <button
                class="window-button close"
                onclick="closeWindow('window-table')"
            >
                ×
            </button>

        </div>

        <div
            id="tableContainer"
            class="window-body table-wrapper"
        >

            <div class="empty-message">
                Select an array or object.
            </div>

        </div>

    </section>

</div>


<!-- =========================================================
     WINDOW MANAGER
========================================================= -->

<div class="window-manager">

    <span class="manager-label">
        WINDOWS
    </span>

    <button
        id="manager-input"
        class="manager-button"
        onclick="openWindow('window-input')"
    >
        📄
    </button>

    <button
        id="manager-search"
        class="manager-button"
        onclick="openWindow('window-search')"
    >
        🔎
    </button>

    <button
        id="manager-tree"
        class="manager-button"
        onclick="openWindow('window-tree')"
    >
        🌳
    </button>

    <button
        id="manager-inspector"
        class="manager-button"
        onclick="openWindow('window-inspector')"
    >
        🔬
    </button>

    <button
        id="manager-table"
        class="manager-button"
        onclick="openWindow('window-table')"
    >
        📋
    </button>

</div>


<script>

/* =========================================================
   STATE
========================================================= */

let rootData = null;

let selectedNode = null;

let selectedPath = "$";

let selectedKey = "root";

let zIndexCounter = 10;


/* =========================================================
   WINDOW DRAGGING
========================================================= */

document
    .querySelectorAll(".window")
    .forEach(
        setupWindow
    );


function setupWindow(windowElement) {

    const header =
        windowElement
            .querySelector(
                ".window-header"
            );


    /* Bring to front */

    windowElement.addEventListener(
        "pointerdown",
        () => {

            bringToFront(
                windowElement
            );

        }
    );


    /* Drag */

    header.addEventListener(
        "pointerdown",
        startDrag
    );


    /* Double click maximize */

    header.addEventListener(
        "dblclick",
        event => {

            if (
                event.target.closest(
                    "button"
                )
            ) {
                return;
            }

            maximizeWindow(
                windowElement.id
            );

        }
    );

}


function bringToFront(
    element
) {

    zIndexCounter++;

    element.style.zIndex =
        zIndexCounter;

}


/* =========================================================
   ACTUAL DRAG LOGIC
========================================================= */

function startDrag(event) {

    if (
        event.target.closest(
            "button"
        )
    ) {
        return;
    }


    const windowElement =
        event.currentTarget
            .closest(".window");


    if (
        windowElement.classList
            .contains("maximized")
    ) {
        return;
    }


    event.preventDefault();


    bringToFront(
        windowElement
    );


    const workspace =
        document.getElementById(
            "workspace"
        );


    const workspaceRect =
        workspace.getBoundingClientRect();


    const windowRect =
        windowElement.getBoundingClientRect();


    const startMouseX =
        event.clientX;

    const startMouseY =
        event.clientY;


    const startLeft =
        windowRect.left -
        workspaceRect.left;


    const startTop =
        windowRect.top -
        workspaceRect.top;


    windowElement
        .setPointerCapture?.(
            event.pointerId
        );


    function move(event) {

        let newLeft =
            startLeft +
            (
                event.clientX -
                startMouseX
            );


        let newTop =
            startTop +
            (
                event.clientY -
                startMouseY
            );


        const maxLeft =
            workspace.clientWidth -
            windowElement.offsetWidth;


        const maxTop =
            workspace.clientHeight -
            windowElement.offsetHeight;


        /*
         * Keep at least part of the window
         * inside the workspace.
         */

        newLeft =
            Math.max(
                -windowElement.offsetWidth + 80,
                Math.min(
                    newLeft,
                    workspace.clientWidth - 80
                )
            );


        newTop =
            Math.max(
                0,
                Math.min(
                    newTop,
                    workspace.clientHeight - 50
                )
            );


        windowElement.style.left =
            `${newLeft}px`;

        windowElement.style.top =
            `${newTop}px`;

    }


    function stop() {

        document.removeEventListener(
            "pointermove",
            move
        );

        document.removeEventListener(
            "pointerup",
            stop
        );

        document.removeEventListener(
            "pointercancel",
            stop
        );

    }


    document.addEventListener(
        "pointermove",
        move
    );

    document.addEventListener(
        "pointerup",
        stop
    );

    document.addEventListener(
        "pointercancel",
        stop
    );

}


/* =========================================================
   MAXIMIZE
========================================================= */

function maximizeWindow(
    id
) {

    const element =
        document.getElementById(
            id
        );


    if (!element) {
        return;
    }


    if (
        element.classList
            .contains("maximized")
    ) {

        element.classList.remove(
            "maximized"
        );


        if (
            element.dataset.oldLeft
        ) {

            element.style.left =
                element.dataset.oldLeft;

            element.style.top =
                element.dataset.oldTop;

            element.style.width =
                element.dataset.oldWidth;

            element.style.height =
                element.dataset.oldHeight;

        }

    } else {

        element.dataset.oldLeft =
            element.style.left ||
            `${element.offsetLeft}px`;

        element.dataset.oldTop =
            element.style.top ||
            `${element.offsetTop}px`;

        element.dataset.oldWidth =
            element.style.width ||
            `${element.offsetWidth}px`;

        element.dataset.oldHeight =
            element.style.height ||
            `${element.offsetHeight}px`;


        element.classList.add(
            "maximized"
        );

    }


    bringToFront(
        element
    );

}


/* =========================================================
   CLOSE / OPEN
========================================================= */

const managerMap = {

    "window-input":
        "manager-input",

    "window-search":
        "manager-search",

    "window-tree":
        "manager-tree",

    "window-inspector":
        "manager-inspector",

    "window-table":
        "manager-table"

};


function closeWindow(id) {

    const element =
        document.getElementById(
            id
        );


    if (!element) {
        return;
    }


    element.classList.add(
        "closed"
    );


    updateManager();

}


function openWindow(id) {

    const element =
        document.getElementById(
            id
        );


    if (!element) {
        return;
    }


    element.classList.remove(
        "closed"
    );


    bringToFront(
        element
    );


    updateManager();

}


function updateManager() {

    Object.entries(
        managerMap
    ).forEach(
        ([windowId, buttonId]) => {

            const windowElement =
                document.getElementById(
                    windowId
                );

            const button =
                document.getElementById(
                    buttonId
                );


            if (
                windowElement.classList
                    .contains("closed")
            ) {

                button.style.display =
                    "block";

            } else {

                button.style.display =
                    "none";

            }

        }
    );

}


/* =========================================================
   JSON PARSER
========================================================= */

function parseJSON() {

    const text =
        document
            .getElementById(
                "jsonInput"
            )
            .value
            .trim();


    const status =
        document.getElementById(
            "status"
        );


    if (!text) {

        status.className =
            "status invalid";

        status.textContent =
            "✕ No JSON provided.";

        return;

    }


    try {

        rootData =
            JSON.parse(text);


        status.className =
            "status valid";

        status.textContent =
            "✓ Valid JSON — ready to explore";


        renderTree();


        selectNode(
            rootData,
            "$",
            "root"
        );


    } catch (error) {

        rootData = null;


        status.className =
            "status invalid";

        status.textContent =
            "✕ " + error.message;


        document
            .getElementById(
                "tree"
            )
            .innerHTML = `

                <div class="tree-empty">
                    Invalid JSON
                    <br><br>
                    ${escapeHTML(
                        error.message
                    )}
                </div>

            `;

    }

}


/* =========================================================
   TREE
========================================================= */

function renderTree() {

    const tree =
        document.getElementById(
            "tree"
        );


    tree.innerHTML = "";


    if (rootData === null) {
        return;
    }


    tree.appendChild(
        createTreeNode(
            "root",
            rootData,
            "$",
            true
        )
    );

}


function createTreeNode(
    key,
    value,
    path,
    expanded = false
) {

    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "tree-node";


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "tree-row";


    row.dataset.path =
        path;


    const isObject =
        value !== null &&
        typeof value === "object";


    const children =
        isObject
            ? Object.entries(value)
            : [];


    const hasChildren =
        children.length > 0;


    const toggle =
        document.createElement(
            "span"
        );


    toggle.className =
        "tree-toggle";


    toggle.textContent =
        hasChildren
            ? expanded
                ? "▼"
                : "▶"
            : "";


    const keyElement =
        document.createElement(
            "span"
        );


    if (key === "root") {

        keyElement.textContent =
            getTypeLabel(value);

        keyElement.className =
            "tree-key";

    } else {

        keyElement.textContent =
            Array.isArray(value)
                ? `[${key}]`
                : key;

        keyElement.className =
            Array.isArray(value)
                ? "tree-index"
                : "tree-key";

    }


    row.appendChild(toggle);

    row.appendChild(keyElement);


    if (!hasChildren) {

        const valueElement =
            document.createElement(
                "span"
            );


        valueElement.className =
            "tree-value " +
            getValueClass(value);


        valueElement.textContent =
            formatShortValue(value);


        row.appendChild(
            valueElement
        );

    } else {

        const type =
            document.createElement(
                "span"
            );


        type.className =
            "tree-type";


        type.textContent =
            getTypeLabel(value);


        row.appendChild(type);

    }


    let childrenContainer = null;


    row.onclick =
        event => {

            event.stopPropagation();


            selectNode(
                value,
                path,
                key
            );


            if (hasChildren) {

                childrenContainer
                    .classList.toggle(
                        "hidden"
                    );


                toggle.textContent =
                    childrenContainer
                        .classList
                        .contains("hidden")
                        ? "▶"
                        : "▼";

            }

        };


    wrapper.appendChild(row);


    if (hasChildren) {

        childrenContainer =
            document.createElement(
                "div"
            );


        childrenContainer.className =
            "tree-children";


        if (!expanded) {

            childrenContainer
                .classList
                .add("hidden");

        }


        children.forEach(
            ([childKey, childValue]) => {

                const childPath =
                    Array.isArray(value)
                        ? `${path}[${childKey}]`
                        : `${path}.${childKey}`;


                childrenContainer.appendChild(
                    createTreeNode(
                        childKey,
                        childValue,
                        childPath,
                        false
                    )
                );

            }
        );


        wrapper.appendChild(
            childrenContainer
        );

    }


    return wrapper;

}


/* =========================================================
   SELECT NODE
========================================================= */

function selectNode(
    value,
    path,
    key
) {

    selectedNode =
        value;

    selectedPath =
        path;

    selectedKey =
        key;


    document
        .querySelectorAll(
            ".tree-row.selected"
        )
        .forEach(
            row =>
                row.classList.remove(
                    "selected"
                )
        );


    const row =
        [
            ...document.querySelectorAll(
                ".tree-row"
            )
        ]
        .find(
            element =>
                element.dataset.path ===
                path
        );


    if (row) {

        row.classList.add(
            "selected"
        );

    }


    renderInspector(
        value,
        path,
        key
    );


    if (
        value !== null &&
        typeof value === "object"
    ) {

        renderTable(
            value
        );

    } else {

        document
            .getElementById(
                "tableContainer"
            )
            .innerHTML = `
                <div class="empty-message">
                    Select an object or array.
                </div>
            `;

    }

}


/* =========================================================
   INSPECTOR
========================================================= */

function renderInspector(
    value,
    path,
    key
) {

    let serialized;


    try {

        serialized =
            JSON.stringify(
                value,
                null,
                4
            );

    } catch {

        serialized =
            String(value);

    }


    document
        .getElementById(
            "inspector"
        )
        .innerHTML = `

            <div class="field-title">
                ${escapeHTML(
                    key === "root"
                        ? "Root"
                        : String(key)
                )}
            </div>

            <div class="field-path">
                ${escapeHTML(path)}
            </div>

            <div class="info-grid">

                <div class="info-label">
                    Type
                </div>

                <div class="info-value">
                    ${escapeHTML(
                        getTypeLabel(value)
                    )}
                </div>

                <div class="info-label">
                    Value
                </div>

                <div class="info-value">
                    ${escapeHTML(
                        getSummary(value)
                    )}
                </div>

                ${
                    Array.isArray(value)
                        ? `
                            <div class="info-label">
                                Length
                            </div>

                            <div class="info-value">
                                ${value.length}
                            </div>
                        `
                        : ""
                }

            </div>

            <div class="value-box">

                <div class="value-box-title">
                    Raw Value
                </div>

                <div class="raw-value">
                    ${escapeHTML(
                        serialized
                    )}
                </div>

                <div class="inspector-buttons">

                    <button onclick="copyPath()">
                        📍 Copy Path
                    </button>

                    <button onclick="copyValue()">
                        📋 Copy Value
                    </button>

                </div>

            </div>
    `;

}


/* =========================================================
   TABLE
========================================================= */

function renderTable(value) {

    const container =
        document.getElementById(
            "tableContainer"
        );


    let rows = [];


    if (Array.isArray(value)) {

        if (!value.length) {

            container.innerHTML = `
                <div class="empty-message">
                    Empty array.
                </div>
            `;

            return;

        }


        if (
            value.every(
                item =>
                    item !== null &&
                    typeof item === "object" &&
                    !Array.isArray(item)
            )
        ) {

            rows =
                value.map(
                    item =>
                        flattenObject(item)
                );

        } else {

            rows =
                value.map(
                    item => ({
                        value: item
                    })
                );

        }

    } else {

        rows = [
            flattenObject(value)
        ];

    }


    const columns =
        [
            ...new Set(
                rows.flatMap(
                    row =>
                        Object.keys(row)
                )
            )
        ];


    if (!columns.length) {

        container.innerHTML = `
            <div class="empty-message">
                No table-compatible fields.
            </div>
        `;

        return;

    }


    let html = `
        <table>
            <thead>
                <tr>
    `;


    columns.forEach(
        column => {

            html += `
                <th>
                    ${escapeHTML(
                        column
                    )}
                </th>
            `;

        }
    );


    html += `
                </tr>
            </thead>

            <tbody>
    `;


    rows.forEach(
        (row, index) => {

            html += `
                <tr
                    onclick="selectTableRow(${index})"
                >
            `;


            columns.forEach(
                column => {

                    html += `
                        <td>
                            ${escapeHTML(
                                formatShortValue(
                                    row[column]
                                )
                            )}
                        </td>
                    `;

                }
            );


            html += `
                </tr>
            `;

        }
    );


    html += `
            </tbody>
        </table>
    `;


    container.innerHTML =
        html;

}


function selectTableRow(index) {

    if (
        !Array.isArray(
            selectedNode
        )
    ) {
        return;
    }


    selectNode(
        selectedNode[index],
        `${selectedPath}[${index}]`,
        index
    );

}


/* =========================================================
   SEARCH
========================================================= */

function searchTree() {

    const query =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();


    const rows =
        document.querySelectorAll(
            ".tree-row"
        );


    let count = 0;


    rows.forEach(
        row => {

            row.classList.remove(
                "search-match"
            );


            if (!query) {
                return;
            }


            const text =
                row.textContent
                    .toLowerCase();


            const path =
                row.dataset.path
                    .toLowerCase();


            if (
                text.includes(query) ||
                path.includes(query)
            ) {

                row.classList.add(
                    "search-match"
                );

                count++;

            }

        }
    );


    document
        .getElementById(
            "searchCount"
        )
        .textContent =
            query
                ? `${count} match${
                    count === 1
                        ? ""
                        : "es"
                }`
                : "0 matches";

}


/* =========================================================
   FLATTEN
========================================================= */

function flattenObject(
    object,
    prefix = "",
    result = {}
) {

    if (
        object === null ||
        typeof object !== "object"
    ) {

        result[
            prefix || "value"
        ] = object;

        return result;

    }


    Object.entries(object)
        .forEach(
            ([key, value]) => {

                const path =
                    prefix
                        ? `${prefix}.${key}`
                        : key;


                if (
                    value !== null &&
                    typeof value === "object" &&
                    !Array.isArray(value)
                ) {

                    flattenObject(
                        value,
                        path,
                        result
                    );

                } else {

                    result[path] =
                        value;

                }

            }
        );


    return result;

}


/* =========================================================
   HELPERS
========================================================= */

function getTypeLabel(value) {

    if (value === null) {
        return "null";
    }

    if (Array.isArray(value)) {
        return `array (${value.length})`;
    }

    if (typeof value === "object") {
        return `object (${
            Object.keys(value).length
        } fields)`;
    }

    return typeof value;

}


function getValueClass(value) {

    if (value === null) {
        return "type-null";
    }

    if (typeof value === "string") {
        return "type-string";
    }

    if (typeof value === "number") {
        return "type-number";
    }

    if (typeof value === "boolean") {
        return "type-boolean";
    }

    return "";

}


function formatShortValue(value) {

    if (value === null) {
        return "null";
    }

    if (typeof value === "string") {
        return `"${value}"`;
    }

    if (typeof value === "object") {

        if (Array.isArray(value)) {
            return `Array [${value.length}]`;
        }

        return `Object {${
            Object.keys(value).length
        }}`;

    }

    return String(value);

}


function getSummary(value) {

    if (value === null) {
        return "null";
    }

    if (typeof value === "string") {
        return value;
    }

    if (typeof value === "object") {

        if (Array.isArray(value)) {
            return `${value.length} items`;
        }

        return `${
            Object.keys(value).length
        } fields`;

    }

    return String(value);

}


function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   COPY
========================================================= */

async function copyText(text) {

    try {

        await navigator.clipboard.writeText(
            text
        );

    } catch (error) {

        console.error(error);

    }

}


function copyPath() {

    copyText(
        selectedPath
    );

}


function copyValue() {

    if (
        selectedNode === null ||
        selectedNode === undefined
    ) {
        return;
    }


    const value =
        typeof selectedNode === "string"
            ? selectedNode
            : JSON.stringify(
                selectedNode,
                null,
                4
            );


    copyText(value);

}


function copyFormatted() {

    if (rootData === null) {
        return;
    }


    copyText(
        JSON.stringify(
            rootData,
            null,
            4
        )
    );

}
